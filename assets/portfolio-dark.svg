<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="Portfolio — Next.js site with a WebGL solar system, launching soon">
  <title>vivekbhadauriya.dev — personal portfolio, launching soon</title>
  
  <defs>
    <linearGradient id="pfdark-signal" x1="0" y1="0" x2="2" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#FFC53D"/>
      <stop offset="0.25" stop-color="#3DDC97"/>
      <stop offset="0.5" stop-color="#3DA9FC"/>
      <stop offset="0.75" stop-color="#3DDC97"/>
      <stop offset="1" stop-color="#FFC53D"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="0 0; -0.5 0; 0 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="pfdark-route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFC53D"/>
      <stop offset="0.5" stop-color="#3DDC97"/>
      <stop offset="1" stop-color="#3DA9FC"/>
    </linearGradient>
    <pattern id="pfdark-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="rgba(255,255,255,0.07)"/>
    </pattern>
    <pattern id="pfdark-stripes" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="4" height="10" fill="#1c1c1f"/>
    </pattern>
    <radialGradient id="pfdark-fade" cx="0.5" cy="0.5" r="0.65">
      <stop offset="0.35" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pfdark-glowblue"><stop offset="0" stop-color="#3DA9FC" stop-opacity="0.165"/><stop offset="1" stop-color="#3DA9FC" stop-opacity="0"/></radialGradient>
    <radialGradient id="pfdark-glowamber"><stop offset="0" stop-color="#FFC53D" stop-opacity="0.11000000000000001"/><stop offset="1" stop-color="#FFC53D" stop-opacity="0"/></radialGradient>
    <mask id="pfdark-fademask"><rect width="100%" height="100%" fill="url(#pfdark-fade)"/></mask>
    <filter id="pfdark-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <defs>
