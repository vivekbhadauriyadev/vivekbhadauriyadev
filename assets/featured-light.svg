<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="SchoolTracify — multi-tenant school platform, live in production">
  <title>SchoolTracify — live in production, 35+ paying institutions</title>
  
  <defs>
    <linearGradient id="flight-signal" x1="0" y1="0" x2="2" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#b87400"/>
      <stop offset="0.25" stop-color="#00925a"/>
      <stop offset="0.5" stop-color="#0a63c9"/>
      <stop offset="0.75" stop-color="#00925a"/>
      <stop offset="1" stop-color="#b87400"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="0 0; -0.5 0; 0 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="flight-route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b87400"/>
      <stop offset="0.5" stop-color="#00925a"/>
      <stop offset="1" stop-color="#0a63c9"/>
    </linearGradient>
    <pattern id="flight-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="rgba(0,0,0,0.07)"/>
    </pattern>
    <pattern id="flight-stripes" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="4" height="10" fill="#ececef"/>
    </pattern>
    <radialGradient id="flight-fade" cx="0.5" cy="0.5" r="0.65">
      <stop offset="0.35" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flight-glowblue"><stop offset="0" stop-color="#0a63c9" stop-opacity="0.075"/><stop offset="1" stop-color="#0a63c9" stop-opacity="0"/></radialGradient>
    <radialGradient id="flight-glowamber"><stop offset="0" stop-color="#b87400" stop-opacity="0.05"/><stop offset="1" stop-color="#b87400" stop-opacity="0"/></radialGradient>
    <mask id="flight-fademask"><rect width="100%" height="100%" fill="url(#flight-fade)"/></mask>
    <filter id="flight-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <defs>
    <linearGradient id="flight-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC53D"/>
      <stop offset="0.55" stop-color="#FF9A1F"/>
      <stop offset="1" stop-color="#E4570E"/>
    </linearGradient>
    <radialGradient id="flight-blob" cx="0.2" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="flight-pdots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.3" fill="#fff" opacity=".22"/>
    </pattern>
    <clipPath id="flight-panelclip"><rect x="704" y="32" width="544" height="496" rx="24"/></clipPath>
    <clipPath id="flight-screen"><rect x="852" y="80" width="240" height="420" rx="30"/></clipPath>
  </defs>
  <style>
    .reveal { opacity: 0; animation: fade-up .9s cubic-bezier(.22,1,.36,1) forwards; }
    @keyframes fade-up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.4s cubic-bezier(.22,1,.36,1) .3s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .road-dash { animation: dash 1.6s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -28; } }
    .ping { transform-box: fill-box; transform-origin: center; animation: ping 1.6s cubic-bezier(0,0,.2,1) infinite; }
    @keyframes ping { 0% { transform: scale(1); opacity: .7; } 80%,100% { transform: scale(3); opacity: 0; } }
    .bob { animation: bob 4s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .reveal { opacity: 1; }
      .draw { stroke-dashoffset: 0; }
    }</style>

  <rect x="1" y="1" width="1278" height="558" rx="28" fill="#fafafa" stroke="rgba(0,0,0,0.08)" stroke-width="1.5"/>

  <!-- copy -->
  <g class="reveal" style="animation-delay:.05s">
    <circle cx="72" cy="68" r="5" fill="#00925a" class="ping"/>
    <circle cx="72" cy="68" r="5" fill="#00925a"/>
    <text x="88" y="73" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="2.6" fill="#62626a">FEATURED · LIVE IN PRODUCTION</text>
  </g>
  <g class="reveal" style="animation-delay:.15s">
    <text x="60" y="148" font-family="'Outfit','Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="72" letter-spacing="-3" fill="#0a0a0a">SchoolTracify</text>
  </g>
  <g class="reveal" style="animation-delay:.28s">
    <text x="64" y="200" font-family="'Instrument Serif',Georgia,'Times New Roman',serif" font-style="italic" font-size="44" fill="url(#flight-signal)">school runs, stress-free.</text>
  </g>
  <g class="reveal" style="animation-delay:.4s" font-family="'Outfit','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" fill="#62626a">
    <text x="64" y="250">Multi-tenant school ERP with live bus tracking, fees,</text>
    <text x="64" y="276">RFID attendance and four role-based apps.</text>
    <text x="64" y="302" fill="#0a0a0a">Built solo — every layer, app to infrastructure.</text>
  </g>
  <g class="reveal" style="animation-delay:0.6s">
      <rect x="64" y="318" width="182" height="104" rx="18" fill="#ffffff" stroke="rgba(0,0,0,0.08)"/>
      <text x="86" y="374" font-family="'Outfit','Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="44" letter-spacing="-1.5" fill="url(#flight-signal)">35+</text>
      <text x="86" y="402" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#62626a">paying institutions</text></g>
    <g class="reveal" style="animation-delay:0.7s">
      <rect x="260" y="318" width="182" height="104" rx="18" fill="#ffffff" stroke="rgba(0,0,0,0.08)"/>
      <text x="282" y="374" font-family="'Outfit','Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="44" letter-spacing="-1.5" fill="#0a0a0a">4</text>
      <text x="282" y="402" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#62626a">roles, one build</text></g>
    <g class="reveal" style="animation-delay:0.8s">
      <rect x="456" y="318" width="182" height="104" rx="18" fill="#ffffff" stroke="rgba(0,0,0,0.08)"/>
      <text x="478" y="374" font-family="'Outfit','Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="44" letter-spacing="-1.5" fill="#0a0a0a">0</text>
      <text x="478" y="402" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#62626a">GPS hardware per bus</text></g>
  <g class="reveal" style="animation-delay:0.9s">
      <rect x="64" y="452" width="147.60000000000002" height="32" rx="16" fill="#f1f1f3" stroke="rgba(0,0,0,0.08)"/>
      <text x="137.8" y="473" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#0a0a0a">Android · Java</text></g>
    <g class="reveal" style="animation-delay:0.96s">
      <rect x="221.60000000000002" y="452" width="97.2" height="32" rx="16" fill="#f1f1f3" stroke="rgba(0,0,0,0.08)"/>
      <text x="270.20000000000005" y="473" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#0a0a0a">Firebase</text></g>
    <g class="reveal" style="animation-delay:1.02s">
      <rect x="328.8" y="452" width="156" height="32" rx="16" fill="#f1f1f3" stroke="rgba(0,0,0,0.08)"/>
      <text x="406.8" y="473" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#0a0a0a">Cloud Functions</text></g>
    <g class="reveal" style="animation-delay:1.08s">
      <rect x="494.8" y="452" width="88.80000000000001" height="32" rx="16" fill="#f1f1f3" stroke="rgba(0,0,0,0.08)"/>
      <text x="539.2" y="473" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#0a0a0a">Next.js</text></g>
    <g class="reveal" style="animation-delay:1.1400000000000001s">
      <rect x="64" y="496" width="122.4" height="32" rx="16" fill="#f1f1f3" stroke="rgba(0,0,0,0.08)"/>
      <text x="125.2" y="517" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#0a0a0a">Google Maps</text></g>
    <g class="reveal" style="animation-delay:1.2s">
      <rect x="196.4" y="496" width="97.2" height="32" rx="16" fill="#f1f1f3" stroke="rgba(0,0,0,0.08)"/>
      <text x="245" y="517" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#0a0a0a">Razorpay</text></g>
    <g class="reveal" style="animation-delay:1.26s">
      <rect x="303.6" y="496" width="63.6" height="32" rx="16" fill="#f1f1f3" stroke="rgba(0,0,0,0.08)"/>
      <text x="335.40000000000003" y="517" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#0a0a0a">RFID</text></g>

  <!-- panel -->
  <g clip-path="url(#flight-panelclip)">
    <rect x="704" y="32" width="544" height="496" fill="url(#flight-panel)"/>
    <rect x="704" y="32" width="544" height="496" fill="url(#flight-pdots)"/>
    <rect x="704" y="32" width="544" height="496" fill="url(#flight-blob)"/>
    <circle cx="1210" cy="520" r="200" fill="#7a2300" opacity=".25"/>

    <!-- phone -->
    <g>
      <rect x="842" y="70" width="260" height="440" rx="38" fill="#0b0b0d"/>
      <rect x="845" y="73" width="254" height="434" rx="36" fill="none" stroke="#2a2a2e" stroke-width="2"/>
      <g clip-path="url(#flight-screen)">
        <rect x="852" y="80" width="240" height="420" fill="#eef1ec"/>
        <!-- streets -->
        <g stroke="#fff" stroke-width="10" opacity=".95">
          <line x1="842" y1="190" x2="1102" y2="220"/>
          <line x1="842" y1="370" x2="1102" y2="340"/>
          <line x1="962" y1="70" x2="982" y2="510"/>
          <line x1="1052" y1="70" x2="1042" y2="510"/>
        </g>
        <rect x="862" y="230" width="80" height="60" rx="8" fill="#d6ead9"/>
        <rect x="992" y="390" width="44" height="70" rx="8" fill="#dfe6f0"/>
        <path id="flight-map" d="M 882 460 C 882 390 1032 400 1032 330 S 972 260 1014 220" fill="none"/>
        <path d="M 882 460 C 882 390 1032 400 1032 330 S 972 260 1014 220" fill="none" stroke="#3DDC97" stroke-width="7" stroke-linecap="round" opacity=".35"/>
        <path d="M 882 460 C 882 390 1032 400 1032 330 S 972 260 1014 220" pathLength="1" fill="none" stroke="#0ea86b" stroke-width="4" stroke-linecap="round" class="draw"/>
        <circle cx="882" cy="460" r="7" fill="#fff" stroke="#0ea86b" stroke-width="3"/>
        <circle cx="1032" cy="332" r="7" fill="#fff" stroke="#0ea86b" stroke-width="3"/>
        <g transform="translate(1014 220)">
          <circle r="12" fill="#3DA9FC" class="ping"/>
          <circle r="11" fill="#fff" stroke="#3DA9FC" stroke-width="4"/>
        </g>
        <g>
          <animateMotion dur="7s" repeatCount="indefinite" rotate="auto"><mpath href="#flight-map"/></animateMotion>
          <circle r="15" fill="#FFC53D" opacity=".35"/>
          <rect x="-11" y="-7" width="22" height="14" rx="4" fill="#FF9A1F" stroke="#fff" stroke-width="2"/>
        </g>
        <!-- top bar -->
        <rect x="852" y="80" width="240" height="74" fill="#FFC53D"/>
        <text x="870" y="114" font-family="'Outfit','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#5a3a00">Route 07 · Morning</text>
        <text x="870" y="138" font-family="'Outfit','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="800" fill="#1a1200">Arriving in 4 min</text>
        <!-- driver sheet -->
        <rect x="864" y="406" width="116" height="80" rx="14" fill="#fff"/>
        <text x="876" y="430" font-family="'Outfit','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#6b6b70">Stop progress</text>
        <text x="876" y="454" font-family="'Outfit','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="800" fill="#0b0b0d">3 / 8</text>
        <rect x="876" y="466" width="92" height="6" rx="3" fill="#e6e6e9"/>
        <rect x="876" y="466" width="35" height="6" rx="3" fill="#0ea86b"/>
      </g>
      <rect x="942" y="88" width="60" height="16" rx="8" fill="#0b0b0d"/>
    </g>

    <!-- floating notification cards -->
    <g class="bob">
      <rect x="724" y="206" width="232" height="70" rx="16" fill="#fff" opacity=".97"/>
      <rect x="738" y="220" width="42" height="42" rx="12" fill="#0ea86b"/>
      <path d="M750 241 l7 7 l13 -14" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="792" y="237" font-family="'Outfit','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#0b0b0d">Aarav boarded the bus</text>
      <text x="792" y="257" font-family="'Outfit','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#6b6b70">RFID · 7:42 AM</text>
    </g>
    <g class="bob" style="animation-delay:-2s">
      <rect x="1058" y="360" width="172" height="96" rx="16" fill="#0b0b0d" opacity=".92"/>
      <text x="1076" y="390" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="1.2" fill="#8b8b92">FEES · THIS MONTH</text>
      <text x="1076" y="424" font-family="'Outfit','Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="28" fill="#fff">92%</text>
      <text x="1150" y="424" font-family="'Outfit','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#3DDC97">collected</text>
      <rect x="1076" y="436" width="136" height="6" rx="3" fill="#2a2a2e"/>
      <rect x="1076" y="436" width="125" height="6" rx="3" fill="#3DDC97"/>
    </g>
  </g>
  <rect x="704" y="32" width="544" height="496" rx="24" fill="none" stroke="rgba(0,0,0,0.08)"/>
</svg>
