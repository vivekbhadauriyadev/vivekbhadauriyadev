<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="220" viewBox="0 0 1280 220" role="img" aria-label="Thanks for stopping by">
  <title>Thanks for stopping by — next stop: something real.</title>
  
  <defs>
    <linearGradient id="ftlight-signal" x1="0" y1="0" x2="2" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#b87400"/>
      <stop offset="0.25" stop-color="#00925a"/>
      <stop offset="0.5" stop-color="#0a63c9"/>
      <stop offset="0.75" stop-color="#00925a"/>
      <stop offset="1" stop-color="#b87400"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="0 0; -0.5 0; 0 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ftlight-route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b87400"/>
      <stop offset="0.5" stop-color="#00925a"/>
      <stop offset="1" stop-color="#0a63c9"/>
    </linearGradient>
    <pattern id="ftlight-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="rgba(0,0,0,0.07)"/>
    </pattern>
    <pattern id="ftlight-stripes" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="4" height="10" fill="#ececef"/>
    </pattern>
    <radialGradient id="ftlight-fade" cx="0.5" cy="0.5" r="0.65">
      <stop offset="0.35" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ftlight-glowblue"><stop offset="0" stop-color="#0a63c9" stop-opacity="0.075"/><stop offset="1" stop-color="#0a63c9" stop-opacity="0"/></radialGradient>
    <radialGradient id="ftlight-glowamber"><stop offset="0" stop-color="#b87400" stop-opacity="0.05"/><stop offset="1" stop-color="#b87400" stop-opacity="0"/></radialGradient>
    <mask id="ftlight-fademask"><rect width="100%" height="100%" fill="url(#ftlight-fade)"/></mask>
    <filter id="ftlight-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .reveal { opacity: 0; animation: fade-up .9s cubic-bezier(.22,1,.36,1) forwards; }
    @keyframes fade-up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.4s cubic-bezier(.22,1,.36,1) .3s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .road-dash { animation: dash 1.6s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -28; } }
    .ping { transform-box: fill-box; transform-origin: center; animation: ping 1.6s cubic-bezier(0,0,.2,1) infinite; }
    @keyframes ping { 0% { transform: scale(1); opacity: .7; } 80%,100% { transform: scale(3); opacity: 0; } }
    .bob { animation: bob 4s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .reveal { opacity: 1; }
      .draw { stroke-dashoffset: 0; }
    }</style>
  <clipPath id="ftlight-clip"><rect x="1" y="1" width="1278" height="218" rx="28"/></clipPath>
  <rect x="1" y="1" width="1278" height="218" rx="28" fill="#fafafa"/>
  <g clip-path="url(#ftlight-clip)">
    <rect width="1280" height="220" fill="url(#ftlight-dots)" mask="url(#ftlight-fademask)"/>
    <path id="ftlight-road" d="M -40 150 C 240 150 360 90 640 90 S 1040 150 1320 150" fill="none"/>
    <path d="M -40 150 C 240 150 360 90 640 90 S 1040 150 1320 150" fill="none" stroke="rgba(0,0,0,0.14)" stroke-width="22" stroke-linecap="round" opacity=".5"/>
    <path d="M -40 150 C 240 150 360 90 640 90 S 1040 150 1320 150" fill="none" stroke="#a1a1a8" stroke-width="2" stroke-dasharray="14 14" class="road-dash" opacity=".55"/>
    
    <g>
      <animateMotion dur="9s" begin="0s" repeatCount="indefinite" rotate="auto" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
        <mpath href="#ftlight-road"/>
      </animateMotion>
      <circle r="16" fill="#00925a" opacity="0.125" filter="url(#ftlight-glow)"/>
      <rect x="-13" y="-8" width="26" height="16" rx="5" fill="#b87400"/>
      <rect x="4" y="-5.5" width="6" height="11" rx="1.5" fill="#fafafa" opacity=".85"/>
      <rect x="-9" y="-5.5" width="10" height="4" rx="1" fill="#fafafa" opacity=".55"/>
      <rect x="-9" y="1.5" width="10" height="4" rx="1" fill="#fafafa" opacity=".55"/>
    </g>
  </g>
  <rect x="1" y="1" width="1278" height="218" rx="28" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="1.5"/>
  <text x="640" y="58" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="4" fill="#62626a">THANKS FOR STOPPING BY</text>
  <text x="640" y="200" text-anchor="middle" font-family="'Instrument Serif',Georgia,'Times New Roman',serif" font-style="italic" font-size="30" fill="url(#ftlight-signal)">next stop: something real.</text>
</svg>
